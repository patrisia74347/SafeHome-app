<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SafeHome - Seiful digital pentru garanțiile tale.">
    <title>SafeHome - Seiful de Garanții</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#" onclick="location.reload()">
                <i class="fas fa-home-shield me-2 text-warning"></i>Safe<span class="text-warning">Home</span>
            </a>
            <div id="authArea"></div>
        </div>
    </nav>

    <div id="heroSection">
        <div class="container text-center">
            <div class="main-visual mb-5 animate__animated animate__zoomIn">
                <div class="shield-circle"><i class="fas fa-vault text-warning"></i></div>
                <div class="floating-icons">
                    <i class="fas fa-laptop item-1"></i>
                    <i class="fas fa-mobile-alt item-2"></i>
                    <i class="fas fa-plug item-3"></i>
                </div>
            </div>
            <h1 class="display-3 fw-bold mb-3">Liniștea casei tale, <br><span class="text-warning">digitalizată.</span></h1>
            <button class="btn btn-warning btn-lg px-5 fw-bold shadow-lg" onclick="toggleLogin(true)">Deschide Seiful</button>
        </div>
    </div>

    <div id="loginOverlay" class="d-none">
        <div class="login-card p-5 shadow-lg text-center animate__animated animate__fadeInDown">
            <h3 id="authTitle" class="fw-bold mb-4">Autentificare</h3>
            <form id="authForm">
                <input type="email" id="emailInput" class="form-control mb-3 rounded-pill text-center" placeholder="Email" required>
                <input type="password" id="passwordInput" class="form-control mb-3 rounded-pill text-center" placeholder="Parolă" required>
                <button type="submit" id="authSubmitBtn" class="btn btn-dark w-100 rounded-pill fw-bold">Intră</button>
            </form>
            <div id="authFeedback" class="auth-feedback mt-2"></div>
            <button class="btn btn-link text-muted mt-3" onclick="toggleAuthMode()" id="authToggleBtn">Creează cont nou</button>
            <br>
            <button class="btn btn-sm text-secondary mt-2" onclick="toggleLogin(false)">Închide</button>
        </div>
    </div>

    <div id="mainDashboard" class="d-none container py-5">
        <div class="d-flex justify-content-between align-items-center mb-5">
            <h2 class="fw-bold mb-0">Seiful tău</h2>
            <button class="btn btn-warning fw-bold rounded-pill shadow-sm" data-bs-toggle="modal" data-bs-target="#productModal" onclick="prepareAdd()">
                <i class="fas fa-plus me-2"></i>Adaugă Produs
            </button>
        </div>
        <div class="row g-3 mb-4">
            <div class="col-md-9">
                <input type="text" id="searchInput" class="form-control rounded-pill border-0 shadow-sm px-4" placeholder="Caută în seif..." oninput="fetchAndRender()">
            </div>
            <div class="col-md-3 text-end">
                <div class="btn-group bg-white p-1 rounded-pill shadow-sm">
                    <button class="btn btn-sm rounded-pill px-3 active" id="btnGrid" onclick="changeView('grid')"><i class="fas fa-th-large"></i></button>
                    <button class="btn btn-sm rounded-pill px-3" id="btnList" onclick="changeView('list')"><i class="fas fa-list"></i></button>
                </div>
            </div>
        </div>
        <div id="productList" class="row g-4"></div>
    </div>

    <div class="modal fade" id="productModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-5 border-0 p-4 shadow-lg">
                <h3 id="modalProductTitle" class="fw-bold mb-4 text-center">Produs Nou</h3>
                <form id="productForm">
                    <input type="hidden" id="editId">
                    <div class="mb-3"><input type="text" id="pName" class="form-control rounded-pill" placeholder="Nume (ex: Laptop)" required></div>
                    <div class="mb-3"><input type="text" id="pModel" class="form-control rounded-pill" placeholder="Model (ex: Lenovo)" required></div>
                    <div class="row g-2 mb-3">
                        <div class="col-md-6"><label class="small ms-2 text-muted">Data Achiziție</label><input type="date" id="pDate" class="form-control rounded-pill" required></div>
                        <div class="col-md-6"><label class="small ms-2 text-muted">Luni Garanție</label><input type="number" id="pDuration" class="form-control rounded-pill" value="24"></div>
                    </div>
                    <button type="submit" class="btn btn-dark w-100 rounded-pill fw-bold py-2">Salvează</button>
                </form>
            </div>
        </div>
    </div>

    <div class="modal fade" id="accountModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-5 border-0 p-4 text-center">
                <i class="fas fa-user-circle fa-4x text-warning mb-3"></i>
                <h4 id="userEmailDisplay" class="fw-bold mb-4 small"></h4>
                <div class="d-grid gap-2">
                    <button class="btn btn-dark rounded-pill fw-bold" onclick="doLogout()">Ieșire</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
